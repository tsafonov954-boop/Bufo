[package]
name = "cliprecorder"
version = "0.1.0"
edition = "2021"
description = "Lightweight instant-replay clip recorder (low RAM, GPU encode)"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.1"
tray-icon = "0.26.1"
wasapi = "0.27.0"
windows-capture = "2.0.1"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
