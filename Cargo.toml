[package]
name = "cliprecorder"
version = "0.1.0"
edition = "2021"
description = "Lightweight instant-replay clip recorder (low RAM, GPU encode)"

[dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
