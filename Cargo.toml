[package]
license = "GPL-3.0-or-later"
name = "bufo"
version = "0.1.0"
edition = "2021"
description = "Lightweight instant-replay clip recorder (low RAM, GPU encode)"

[features]
# Embed a compressed ffmpeg.exe in bufo.exe (env BUFO_FFMPEG_XZ = path to ffmpeg.exe.xz).
bundle-ffmpeg = ["dep:lzma-rs"]

[dependencies]
eframe = "0.37.0"
egui_extras = { version = "0.37.0", features = ["image", "file"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
# Only for the single-file build (see scripts/make-single.ps1): unpacks the bundled ffmpeg.
lzma-rs = { version = "0.3", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.1"

# Windows-only: native capture, WASAPI audio, tray icon, hotkeys.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Foundation"] }
tray-icon = "0.26.1"
wasapi = "0.27.0"
windows-capture = "2.0.1"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Time",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

# Linux/other: global hotkeys (X11).
[target.'cfg(not(windows))'.dependencies]
global-hotkey = "0.7"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[patch.crates-io]
windows-capture = { path = "vendor/windows-capture" }
